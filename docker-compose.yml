services:
  jyantrack-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: jyantrack-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-YourStrong@Password123!}"
      MSSQL_PID: "Express"
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: >
        bash -c '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${MSSQL_SA_PASSWORD:-YourStrong@Password123!}" -C -Q "SELECT 1" 2>/dev/null ||
        /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "${MSSQL_SA_PASSWORD:-YourStrong@Password123!}" -Q "SELECT 1" 2>/dev/null'
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  jyantrack-api:
    image: jyantrack-api:latest
    container_name: jyantrack-api
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      jyantrack-db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=jyantrack-db,1433;Database=JyanTrackDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-YourStrong@Password123!};TrustServerCertificate=True;MultipleActiveResultSets=true;"
    ports:
      - "${APP_PORT:-5062}:8080"
    restart: unless-stopped

volumes:
  mssql_data:
    driver: local
